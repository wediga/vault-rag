[project]
name = "vault-rag"
version = "0.1.0"
description = "Search an Obsidian vault over MCP with vector search and the wikilink graph"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
